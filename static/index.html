<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient MultiDisease Predictor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
    --bg-color: #f0f4f8;
    --card-bg: rgb(0, 0, 0, 0.7);
    --text-main: rgb(255, 195, 85);
    --text-light: rgb(255, 255, 255);
    --primary: rgb(255, 195, 85);
    --primary-hover: rgb(255, 165, 0);
    
    /* Status Colors */
    --good: #48bb78;
    --warning: #ed8936;
    --danger: #e53e3e;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    background-image: url('shutterstock_1576424071-1.jpg');
    color: var(--text-main);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    transition: background-image 0.5s ease-in-out;
    padding: 2rem;
}

.container {
    background: var(--card-bg);
    max-width: 900px;
    width: 100%;
    padding: 40px 50px;
    border-radius: 50px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.15);
    position: relative;
}

.header {
    text-align: center;
    margin-bottom: 2rem;
}

.header h1 {
    color: var(--primary);
    font-size: 2.4rem;
    margin-bottom: 0.5rem;
}

.header p {
    color: var(--text-light);
}

/* Model Selection Area */
.model-selection-wrapper {
    background: rgb(255, 255, 255, 0.8);
    padding: 1.5rem;
    border-radius: 12px;
    margin-bottom: 2rem;
    border-left: 5px solid var(--primary);
}

.model-selection-wrapper label {
    display: block;
    font-weight: 600;
    margin-bottom: 0.5rem;
    color: var(--primary-hover);
}

.model-selection-wrapper select {
    width: 100%;
    padding: 10px;
    border: 1px solid orange;
    border-radius: 12px;
    font-size: 1rem;
    background-color: rgb(255, 195, 85);
    cursor: pointer;
}

/* Form Grid Layout */
.form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 1.5rem;
    margin-bottom: 2rem;
}

.input-group label {
    display: block;
    font-size: 1rem;
    font-weight: 600;
    margin-bottom: 0.4rem;
    color: var(--text-main);
}

.input-group input, 
.input-group select {
    width: 100%;
    padding: 12px;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    font-size: 1rem;
    transition: 0.3s;
    background: rgb(248, 250, 252, 0.7);
}

.input-group input:focus, 
.input-group select:focus {
    border-color: var(--primary);
    outline: none;
    box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.1);
}

.submit-btn {
    width: 100%;
    padding: 15px;
    background-color: var(--primary);
    color: rgb(54, 11, 11);
    border: none;
    border-radius: 100px;
    font-size: 1.3rem;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
}

.submit-btn:hover {
    background-color: var(--primary-hover);
    transform: translateY(-2px);
}

/* Prediction Result UI */
.result-container {
    max-width: 500px;
    text-align: center;
}

.result-card {
    font-size: 1.3rem;
    padding: 2rem;
    border-radius: 15px;
    border-top: 8px solid var(--primary);
}

.model-used {
    color: var(--text-light);
    font-size: 1rem;
    margin-bottom: 2rem;
}

.model-used span {
    font-weight: 600;
    color: var(--text-main);
}

.battery-visual h1 {
    font-size: 4rem;
    margin-bottom: 0;
}

.action-box {
    margin: 2rem 0;
    padding: 1.5rem;
    border-radius: 12px;
    background: #f7fafc;
}

.action-box h3 {
    color: var(--text-light);
    font-weight: 400;
    font-size: 1rem;
    margin-bottom: 0.5rem;
}

.recommendation-text {
    font-size: 2.1rem;
    font-weight: 600;
}

.back-btn {
    display: inline-block;
    text-decoration: none;
    padding: 10px 25px;
    border: 2px solid var(--primary);
    color: var(--primary);
    border-radius: 8px;
    font-weight: 600;
    transition: 0.3s;
}

.back-btn:hover {
    background: var(--primary);
    color: rgb(54, 11, 11);
}

/* Dynamic Status Colors for Results Page */
.status-good .battery-visual h1, .status-good .recommendation-text { color: var(--good); }
.status-good { border-top-color: var(--good); }

.status-warning .battery-visual h1, .status-warning .recommendation-text { color: var(--warning); }
.status-warning { border-top-color: var(--warning); }

.status-danger .battery-visual h1, .status-danger .recommendation-text { color: var(--danger); }
.status-danger { border-top-color: var(--danger); }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>⚕️ Patient Multi-Disease Predictor</h1>
            <p>Enter patient demographics, lifestyle factors, and clinical metrics to assess multidisease risk.</p>
        </header>

        <form action="/predict" method="POST" class="prediction-form">
            
            <div class="model-selection-wrapper">
                <label for="model_selection">🧠 Select Predictive Model</label>
                <select name="model_selection" id="model_selection" required>
                    <optgroup label="Machine Learning Models">
                        <option value="ML|Logistic-Regression">Logistic Regression</option>
                        <option value="ML|RandomForest-Classifier" selected>Random Forest Classifier</option>
                        <option value="ML|AdaBoost-Classifier">AdaBoost Classifier</option>
                        <option value="ML|GradientBoosting-Classifier">Gradient Boosting Classifier</option>
                        <option value="ML|XGBoost-Classifier">XGBoost Classifier</option>
                        <option value="ML|XGBoostRF-Classifier">XGBoost RF-Classifier</option>
                        <option value="ML|LightGBM-Classifier">LightGBM Classifier</option>
                        <option value="ML|CatBoost-Classifier">CatBoost Classifier</option>
                    </optgroup>
                    <optgroup label="Deep Learning Models">
                        <option value="DL|DNN">Deep Neural Network (DNN)</option>
                        <option value="DL|CNN-LSTM">CNN-LSTM</option>
                        <option value="DL|CNN-BiLSTM">CNN-BiLSTM</option>
                        <option value="DL|CNN-GRU">CNN-GRU</option>
                        <option value="DL|CNN-BiGRU">CNN-BiGRU</option>
                    </optgroup>
                </select>
            </div>

            <div class="form-grid">
                <!-- Demographics & Lifestyle -->
                <div class="input-group"><label>Age</label><input type="number" name="age" required></div>
                <div class="input-group">
                    <label>Gender</label>
                    <select name="gender" required><option value="Female">Female</option><option value="Male">Male</option></select>
                </div>
                <div class="input-group">
                    <label>Education Level</label>
                    <select name="education_level" required><option value="Primary">Primary</option><option value="Secondary">Secondary</option><option value="Tertiary">Tertiary</option></select>
                </div>
                <div class="input-group">
                    <label>Employment Status</label>
                    <select name="employment_status" required><option value="Employed">Employed</option><option value="Unemployed">Unemployed</option><option value="Retired">Retired</option></select>
                </div>
                <div class="input-group">
                    <label>Smoking Status</label>
                    <select name="smoking" required><option value="Never">Never</option><option value="Former">Former</option><option value="Current">Current</option></select>
                </div>
                <div class="input-group">
                    <label>Physical Activity</label>
                    <select name="physical_activity" required><option value="Low">Low</option><option value="Moderate">Moderate</option><option value="High">High</option></select>
                </div>
                <div class="input-group">
                    <label>Stress Level</label>
                    <select name="stress_level" required><option value="Low">Low</option><option value="Medium">Medium</option><option value="High">High</option></select>
                </div>
                <div class="input-group">
                    <label>Sugar Consumption</label>
                    <select name="sugar_consumption" required><option value="Low">Low</option><option value="Medium">Medium</option><option value="High">High</option></select>
                </div>
                <div class="input-group">
                    <label>Family History</label>
                    <select name="family_history" required><option value="No">No</option><option value="Yes">Yes</option></select>
                </div>
                
                <!-- Clinical Measurements -->
                <div class="input-group"><label>BMI</label><input type="number" step="0.1" name="bmi" required></div>
                <div class="input-group"><label>Sleep (Hours/Day)</label><input type="number" step="0.1" name="sleep_hours" required></div>
                <div class="input-group"><label>Alcohol Intake</label><input type="number" step="0.1" name="alcohol_intake" required></div>
                <div class="input-group"><label>Salt Intake</label><input type="number" step="0.1" name="salt_intake" required></div>
                <div class="input-group"><label>Systolic BP</label><input type="number" step="0.1" name="systolic_bp" required></div>
                <div class="input-group"><label>Diastolic BP</label><input type="number" step="0.1" name="diastolic_bp" required></div>
                <div class="input-group"><label>Heart Rate (bpm)</label><input type="number" step="0.1" name="heart_rate" required></div>
                <div class="input-group"><label>Glucose</label><input type="number" step="0.1" name="glucose" required></div>
                <div class="input-group"><label>HbA1c Level</label><input type="number" step="0.1" name="HbA1c_level" required></div>
                <div class="input-group"><label>Cholesterol</label><input type="number" step="0.1" name="cholesterol" required></div>
                <div class="input-group"><label>Triglycerides</label><input type="number" step="0.1" name="triglycerides" required></div>
                <div class="input-group"><label>HDL</label><input type="number" step="0.1" name="hdl" required></div>
                <div class="input-group"><label>LDL</label><input type="number" step="0.1" name="ldl" required></div>
                <div class="input-group"><label>CRP Level</label><input type="number" step="0.1" name="crp_level" required></div>
                <div class="input-group"><label>Homocysteine Level</label><input type="number" step="0.1" name="homocysteine_level" required></div>
            </div>

            <button type="submit" class="submit-btn">Diagnose Patient Risk</button>
        </form>
    </div>
</body>
</html>
