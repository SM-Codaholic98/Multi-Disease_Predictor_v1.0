<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnostic Result</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
    --bg-color: #f0f4f8;
    --card-bg: rgba(255, 255, 255, 0.95);
    --text-main: #2d3748;
    --text-light: #718096;
    --primary: #3182ce;
    --primary-hover: #2b6cb0;
    
    /* Status Colors */
    --good: #48bb78;
    --warning: #ed8936;
    --danger: #e53e3e;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    background-image: url('iStock-1689003176.jpg');
    color: var(--text-main);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    transition: background-image 0.5s ease-in-out;
    padding: 2rem;
}

.container {
    background: var(--card-bg);
    max-width: 900px;
    width: 100%;
    padding: 40px 50px;
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
    border: 1px solid rgba(0, 0, 0, 0.05);
    position: relative;
}

.header {
    text-align: center;
    margin-bottom: 2rem;
}

.header h1 {
    color: var(--primary);
    font-size: 2.2rem;
    margin-bottom: 0.5rem;
}

.header p {
    color: var(--text-light);
}

/* Model Selection Area */
.model-selection-wrapper {
    background: #ebf8ff;
    padding: 1.5rem;
    border-radius: 12px;
    margin-bottom: 2rem;
    border-left: 5px solid var(--primary);
}

.model-selection-wrapper label {
    display: block;
    font-weight: 600;
    margin-bottom: 0.5rem;
    color: var(--primary-hover);
}

.model-selection-wrapper select {
    width: 100%;
    padding: 10px;
    border: 1px solid #63b3ed;
    border-radius: 12px;
    font-size: 1rem;
    background-color: #ffffff;
    color: var(--text-main);
    cursor: pointer;
}

/* Form Grid Layout */
.form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 1.5rem;
    margin-bottom: 2rem;
}

.input-group label {
    display: block;
    font-size: 0.95rem;
    font-weight: 600;
    margin-bottom: 0.4rem;
    color: var(--text-main);
}

.input-group input, 
.input-group select {
    width: 100%;
    padding: 10px;
    border: 1px solid #cbd5e0;
    border-radius: 8px;
    font-size: 0.95rem;
    transition: 0.3s;
    background: #ffffff;
    color: var(--text-main);
}

.input-group input:focus, 
.input-group select:focus {
    border-color: var(--primary);
    outline: none;
    box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.15);
}

.submit-btn {
    width: 100%;
    padding: 15px;
    background-color: var(--primary);
    color: #ffffff;
    border: none;
    border-radius: 12px;
    font-size: 1.2rem;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
}

.submit-btn:hover {
    background-color: var(--primary-hover);
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(49, 130, 206, 0.3);
}

/* Prediction Result UI */
.result-container {
    max-width: 600px;
    text-align: center;
}

.result-card {
    padding: 2.5rem;
    border-radius: 15px;
    border-top: 8px solid var(--primary);
    background: #ffffff;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
}

.model-used {
    color: var(--text-light);
    font-size: 0.95rem;
    margin-bottom: 2rem;
}

.model-used span {
    font-weight: 600;
    color: var(--primary);
}

.battery-visual h1 {
    color: var(--text-main);
}

.action-box {
    margin: 2rem 0;
    padding: 1.5rem;
    border-radius: 12px;
    background: #f7fafc;
    border: 1px solid #e2e8f0;
}

.action-box h3 {
    color: var(--text-light);
    font-weight: 600;
    font-size: 1rem;
    margin-bottom: 0.5rem;
}

.recommendation-text {
    font-size: 1.3rem;
    font-weight: 600;
    color: var(--text-main);
}

.back-btn {
    display: inline-block;
    text-decoration: none;
    padding: 12px 30px;
    background: #edf2f7;
    color: var(--text-main);
    border-radius: 8px;
    font-weight: 600;
    transition: 0.3s;
}

.back-btn:hover {
    background: #e2e8f0;
    color: var(--primary-hover);
}

/* Dynamic Status Colors for Results Page */
.status-good .battery-visual h1, .status-good .action-box { color: var(--good); border-color: var(--good); }
.status-good { border-top-color: var(--good); }

.status-warning .battery-visual h1, .status-warning .action-box { color: var(--warning); border-color: var(--warning); }
.status-warning { border-top-color: var(--warning); }

.status-danger .battery-visual h1, .status-danger .action-box { color: var(--danger); border-color: var(--danger); }
.status-danger { border-top-color: var(--danger); }
    </style>
</head>
<body>
    <div class="container result-container">
        <div class="result-card {{ status_class }}">
            <h2>Diagnostics Complete</h2>
            <p class="model-used">Engine: <span>{{ model_name }}</span></p>
            
            <div class="battery-visual">
                <h1 style="font-size: 2.5rem; margin-bottom: 10px;">{{ prediction }}</h1>
                <p>Predicted Patient Condition</p>
            </div>

            <div class="action-box">
                <h3>{{ icon }} Recommended Action:</h3>
                <h2 class="recommendation-text" style="font-size: 1.4rem;">{{ recommendation }}</h2>
            </div>

            <a href="/" class="back-btn">Evaluate New Patient</a>
        </div>
    </div>
</body>
</html>
