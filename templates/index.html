<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient MultiDisease Predictor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <header class="header">
            <h1>⚕️ Multi-Disease Predictor</h1>
            <p>Enter patient demographics, lifestyle factors, and clinical metrics to assess multidisease risk.</p>
        </header>

        <form action="/predict" method="POST" class="prediction-form">

            <div class="model-selection-wrapper">
                <label for="model_selection">🧠 Select Predictive Model</label>
                <select name="model_selection" id="model_selection" required>
                    <optgroup label="Machine Learning Models">
                        <option value="ML|Logistic-Regression">Logistic Regression</option>
                        <option value="ML|Ridge-Classifier">Ridge Classifier</option>
                        <option value="ML|SGD-Classifier">SGD Classifier</option>
                        <option value="ML|K-Nearest-Neighbors">K-Nearest Neighbors</option>
                        <option value="ML|Gaussian-Naive-Bayes">Gaussian Naive Bayes</option>
                        <option value="ML|Bernoulli-Naive-Bayes">Bernoulli Naive Bayes</option>
                        <option value="ML|Linear-Discriminant-Analysis">Linear Discriminant Analysis</option>
                        <option value="ML|Quadratic-Discriminant-Analysis">Quadratic Discriminant Analysis</option>
                        <option value="ML|Decision-Tree-Classifier">Decision Tree Classifier</option>
                        <option value="ML|RandomForest-Classifier" selected>Random Forest Classifier</option>
                        <option value="ML|Bagging-Classifier">Bagging Classifier</option>
                        <option value="ML|AdaBoost-Classifier">AdaBoost Classifier</option>
                        <option value="ML|GradientBoosting-Classifier">Gradient Boosting Classifier</option>
                        <option value="ML|HistGradientBoosting-Classifier">HistGradientBoosting Classifier</option>
                        <option value="ML|XGBoost-Classifier">XGBoost Classifier</option>
                        <option value="ML|XGBoostRF-Classifier">XGBoost RF-Classifier</option>
                        <option value="ML|LightGBM-Classifier">LightGBM Classifier</option>
                        <option value="ML|CatBoost-Classifier">CatBoost Classifier</option>
                        <option value="ML|MLP-Classifier">MLP Classifier</option>
                    </optgroup>
                    <optgroup label="Deep Learning Models">
                        <option value="DL|DNN">Deep Neural Network (DNN)</option>
                        <option value="DL|CNN-LSTM">CNN-LSTM</option>
                        <option value="DL|CNN-BiLSTM">CNN-BiLSTM</option>
                        <option value="DL|CNN-GRU">CNN-GRU</option>
                        <option value="DL|CNN-BiGRU">CNN-BiGRU</option>
                    </optgroup>
                </select>
            </div>

            <div class="form-grid">
                <!-- Demographics & Lifestyle -->
                <div class="input-group"><label>Age</label><input type="number" name="age" required></div>
                <div class="input-group">
                    <label>Gender</label>
                    <select name="gender" required>
                        <option value="Female">Female</option>
                        <option value="Male">Male</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Education Level</label>
                    <select name="education_level" required>
                        <option value="Primary">Primary</option>
                        <option value="Secondary">Secondary</option>
                        <option value="Tertiary">Tertiary</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Employment Status</label>
                    <select name="employment_status" required>
                        <option value="Employed">Employed</option>
                        <option value="Unemployed">Unemployed</option>
                        <option value="Retired">Retired</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Smoking Status</label>
                    <select name="smoking" required>
                        <option value="Never">Never</option>
                        <option value="Former">Former</option>
                        <option value="Current">Current</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Physical Activity</label>
                    <select name="physical_activity" required>
                        <option value="Low">Low</option>
                        <option value="Moderate">Moderate</option>
                        <option value="High">High</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Stress Level</label>
                    <select name="stress_level" required>
                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Sugar Consumption</label>
                    <select name="sugar_consumption" required>
                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Family History</label>
                    <select name="family_history" required>
                        <option value="No">No</option>
                        <option value="Yes">Yes</option>
                    </select>
                </div>

                <!-- Clinical Measurements -->
                <div class="input-group"><label>BMI</label><input type="number" step="0.001" name="bmi" required></div>
                <div class="input-group"><label>Sleep (Hours/Day)</label><input type="number" step="0.001"
                        name="sleep_hours" required></div>
                <div class="input-group"><label>Alcohol Intake</label><input type="number" step="0.001"
                        name="alcohol_intake" required></div>
                <div class="input-group"><label>Salt Intake</label><input type="number" step="0.001" name="salt_intake"
                        required></div>
                <div class="input-group"><label>Systolic BP</label><input type="number" step="0.001" name="systolic_bp"
                        required></div>
                <div class="input-group"><label>Diastolic BP</label><input type="number" step="0.001"
                        name="diastolic_bp" required></div>
                <div class="input-group"><label>Heart Rate (bpm)</label><input type="number" step="0.001"
                        name="heart_rate" required></div>
                <div class="input-group"><label>Glucose</label><input type="number" step="0.001" name="glucose"
                        required>
                </div>
                <div class="input-group"><label>HbA1c Level</label><input type="number" step="0.001" name="HbA1c_level"
                        required></div>
                <div class="input-group"><label>Cholesterol</label><input type="number" step="0.001" name="cholesterol"
                        required></div>
                <div class="input-group"><label>Triglycerides</label><input type="number" step="0.001"
                        name="triglycerides" required></div>
                <div class="input-group"><label>HDL</label><input type="number" step="0.001" name="hdl" required></div>
                <div class="input-group"><label>LDL</label><input type="number" step="0.001" name="ldl" required></div>
                <div class="input-group"><label>CRP Level</label><input type="number" step="0.001" name="crp_level"
                        required></div>
                <div class="input-group"><label>Homocysteine Level</label><input type="number" step="0.001"
                        name="homocysteine_level" required></div>
            </div>

            <button type="submit" class="submit-btn">Diagnose Diseases</button>
        </form>
    </div>
</body>

</html>
